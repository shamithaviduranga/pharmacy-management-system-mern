services:
  - type: web
    name: pharmacare
    runtime: node
    plan: free
    buildCommand: npm --prefix client ci && npm --prefix client run build && npm --prefix server ci
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
